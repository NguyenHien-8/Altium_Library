name: Build and Publish Altium Migrator

on:
  push:
    branches:
      - migrator
  pull_request:
    branches:
      - migrator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout migrator source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Build and run tests
        run: ./gradlew clean build --info

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        if: github.event_name != 'pull_request'
        run: ./gradlew bootBuildImage --info

      - name: Tag Docker image
        if: github.event_name != 'pull_request'
        run: docker tag altium-migrator:latest ${{ secrets.DOCKERHUB_USERNAME }}/altium-migrator:latest

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/altium-migrator:latest
