server:
  port: 8093
  error:
    whitelabel:
      enabled: false

spring:
  liquibase:
    enabled: false  # Migration is executed manually by LiquibaseMigrationService.
  profiles:
    active: ${PROFILE:dev}
  main:
    allow-bean-definition-overriding: false

  datasource:
    hikari:
      minimum-idle: 1
      idle-timeout: 10000
      maximumPoolSize: 2

  sql:
    init:
      platform: postgres
      continue-on-error: false

# Repository that contains the migration scripts.
# Defaults are configured for NguyenHien-8/Altium_Library, branch master.
git.repository.url: "${MIGRATION_GIT_REPOSITORY_URL:https://github.com/NguyenHien-8/Altium_Library.git}"
git.repository.branch: "${MIGRATION_GIT_BRANCH:master}"
git.repository.directory.name: "migrations"

migration.root.folder: "/tmp/src/main/resources/db"
db.changelog.file.name: "db.changelog-master.xml"
db.schema.name: ${LIQUIBASE_SCHEMA_NAME:altium}
